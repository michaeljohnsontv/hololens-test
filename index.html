<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holo Test</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#4a5a70;font-family:system-ui,sans-serif}
    canvas{width:100%;height:100%;touch-action:none}
    #ui{position:fixed;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;
        background:rgba(0,0,0,.6);color:#fff;padding:10px 12px;border-radius:10px;font-size:16px}
    #ui select,#ui button{font-size:16px;padding:6px 8px}
    #status{font-size:13px;opacity:.8}
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <label>Model:
    <select id="pick"></select>
  </label>
  <button id="local">Load .glb from this device…</button>
  <input id="file" type="file" accept=".glb" hidden>
  <span id="status"></span>
</div>
<script>
  // ── Your models: add one line per .glb uploaded to this folder ──
  const MODELS = [
    { name: "A35", file: "A35 gas turbine.glb", scale: 1 },
    // { name: "Engine part", file: "engine.glb", scale: 0.1 },
  ];

  const canvas = document.getElementById("c");
  const engine = new BABYLON.Engine(canvas, true);
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);   // transparent so passthrough shows through

  const cam = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 2.5, 3, new BABYLON.Vector3(0, 1.2, 1), scene);
  cam.attachControl(canvas, true);
  new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
  // Reflection lighting, so metallic Blender materials don't render pitch black
  scene.createDefaultEnvironment({ createGround: false, createSkybox: false });

  const pick = document.getElementById("pick");
  const fileInput = document.getElementById("file");
  const status = document.getElementById("status");
  let current = null;

  async function load(source, scale = 1, label = "") {
    status.textContent = "Loading " + label + "…";
    try {
      if (current) current.dispose(false, true);           // remove previous model + its textures
      const { meshes } = (typeof source === "string")
        ? await BABYLON.SceneLoader.ImportMeshAsync("", "./", source, scene)
        : await BABYLON.SceneLoader.ImportMeshAsync("", "", source, scene, null, ".glb");
      current = meshes[0];
      current.scaling.scaleInPlace(scale);
      current.position = new BABYLON.Vector3(0, 1.2, 1);  // chest height, 1 m in front of you
      current.addBehavior(new BABYLON.SixDofDragBehavior()); // grab & move with hands/controllers
      status.textContent = label + " loaded";
    } catch (e) {
      status.textContent = "Couldn't load " + label + " (check the file name)";
      console.error(e);
    }
  }

  // Fill the dropdown and load the first model
  MODELS.forEach((m, i) => pick.add(new Option(m.name, i)));
  pick.onchange = () => { const m = MODELS[pick.value]; load(m.file, m.scale, m.name); };
  pick.onchange();

  // Local file: stays on the device, never uploaded
  document.getElementById("local").onclick = () => fileInput.click();
  fileInput.onchange = () => { const f = fileInput.files[0]; if (f) load(f, 1, f.name); };

  // Put the model 1 m in front of the headset, slightly below eye level
  function placeInFront(xrCam) {
    if (!current) return;
    const fwd = xrCam.getDirection(BABYLON.Axis.Z);
    fwd.y = 0; fwd.normalize();
    current.position = xrCam.globalPosition.add(fwd.scale(1));
    current.position.y = xrCam.globalPosition.y - 0.2;
  }

  // "Enter AR" button: Quest, HoloLens 2 (Edge) and Android Chrome
  (async () => {
    const xr = await scene.createDefaultXRExperienceAsync({
      uiOptions: { sessionMode: "immersive-ar", referenceSpaceType: "local-floor" },
      optionalFeatures: true,                              // hand tracking where available
      disableTeleportation: true                           // frees the thumbsticks (no more turning *you*)
    });

    // Thumbstick left/right spins the model around its own centre
    const SPIN_SPEED = 1.5;                                // radians per second at full tilt (~90°/s)
    const sticks = [];
    xr.input.onControllerAddedObservable.add(ctrl => {
      ctrl.onMotionControllerInitObservable.add(mc => {
        const stick = mc.getComponent("xr-standard-thumbstick");
        if (stick) sticks.push(stick);
      });
    });
    xr.input.onControllerRemovedObservable.add(() => sticks.length = 0);
    scene.onBeforeRenderObservable.add(() => {
      if (!current) return;
      const x = sticks.reduce((sum, s) => sum + s.axes.x, 0);
      if (Math.abs(x) < 0.15) return;                      // dead zone so it doesn't drift
      const { min, max } = current.getHierarchyBoundingVectors();
      const centre = min.add(max).scale(0.5);
      current.rotateAround(centre, BABYLON.Axis.Y, x * SPIN_SPEED * engine.getDeltaTime() / 1000);
    });
    xr.baseExperience.onStateChangedObservable.add(state => {
      if (state !== BABYLON.WebXRState.IN_XR) return;
      let frames = 0;                                      // wait ~half a second for tracking to settle
      const obs = xr.baseExperience.sessionManager.onXRFrameObservable.add(() => {
        if (++frames < 30) return;
        placeInFront(xr.baseExperience.camera);
        xr.baseExperience.sessionManager.onXRFrameObservable.remove(obs);
      });
    });
  })();

  engine.runRenderLoop(() => scene.render());
  window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
