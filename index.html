<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holo Test</title>
  <style>html,body{margin:0;height:100%;overflow:hidden;background:#111}canvas{width:100%;height:100%;touch-action:none}</style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const MODEL = "model.glb";   // your Blender export, in the same folder
  const SCALE = 1;             // 1 Blender unit = 1 metre; change if it's too big/small

  const canvas = document.getElementById("c");
  const engine = new BABYLON.Engine(canvas, true);
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);   // transparent so passthrough shows through

  // Desktop preview camera (drag to orbit) + soft light
  const cam = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 2.5, 3, new BABYLON.Vector3(0, 1.2, 1), scene);
  cam.attachControl(canvas, true);
  new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

  (async () => {
    const { meshes } = await BABYLON.SceneLoader.ImportMeshAsync("", "./", MODEL, scene);
    const root = meshes[0];
    root.scaling.scaleInPlace(SCALE);
    root.position = new BABYLON.Vector3(0, 1.2, 1);      // chest height, 1 m in front of you
    root.addBehavior(new BABYLON.SixDofDragBehavior());  // grab & move with hands or controllers

    // Adds the "Enter AR" button; works on Quest, HoloLens 2 (Edge) and Android Chrome
    await scene.createDefaultXRExperienceAsync({
      uiOptions: { sessionMode: "immersive-ar", referenceSpaceType: "local-floor" },
      optionalFeatures: true                             // turns on hand tracking where available
    });
  })();

  engine.runRenderLoop(() => scene.render());
  window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
